<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aravind Sagar</title>
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./mobile.css" />
  </head>
  <body>
    <!-- Desktop layout (≥1025px) -->
    <main class="wrapper">
      <header class="header">
        <div class="header__logo">ARAVIND.SYS</div>
        <div class="header__right">
          <div id="d-system-time" class="header__time">00:00:00</div>
          <div class="header__diamond"></div>
        </div>
      </header>
      <div class="page-body">
        <nav class="menu">
          <ul>
            <a href="#about" class="active">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
          </ul>
          <button id="darkmode-toggle" class="darkmode-btn">// BLACKOUT_MODE</button>
        </nav>

        <div class="content-container">
          <section id="about" class="content-section">
            <h2 id="about-heading"></h2>
            <div id="about-bio"></div>

            <div id="skills-container" class="subsection">
              <h3>Skills</h3>
              <div id="skills-grid" class="skills-grid"></div>
            </div>

            <div id="experience-container" class="subsection">
              <h3>Experience</h3>
              <div id="experience-list"></div>
            </div>

            <div id="education-container" class="subsection">
              <h3>Education</h3>
              <div id="education-grid" class="education-grid"></div>
            </div>
          </section>

          <section id="projects" class="content-section">
            <h2>Selected Projects</h2>
            <div id="projects-list"></div>
          </section>

          <section id="contact" class="content-section">
            <h2>Comm Channels</h2>
            <div id="contact-list" class="contact-links"></div>
          </section>
        </div>
      </div>
    </main>

    <!-- Mobile layout (≤1024px) -->
    <div class="mobile-wrapper">
      <header class="mobile-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="status-indicator"></span>
          <div class="m-header-text">ARAVIND.SYS</div>
        </div>
        <div id="m-system-time" class="m-mono">00:00:00</div>
      </header>

      <div class="mobile-grid-container">
        <div class="m-section">
          <div class="m-section-header">
            <h1 class="m-header-text">OPERATOR_PROFILE</h1>
          </div>
          <div id="m-about-block" class="m-text-block"></div>
          <div class="m-text-block" style="padding:12px 16px;">
            <button id="m-darkmode-toggle" class="m-darkmode-btn">// BLACKOUT_MODE</button>
          </div>
        </div>

        <div class="m-section">
          <div class="m-section-header">
            <h1 class="m-header-text">PROJECT_LOG</h1>
          </div>
          <div id="m-projects-list"></div>
        </div>

        <div class="m-section">
          <div class="m-section-header">
            <h1 class="m-header-text">SYSTEM_SPECS</h1>
          </div>
          <div id="m-skills-block" class="m-text-block"></div>
          <div id="m-experience-block" class="m-text-block"></div>
          <div id="m-education-block" class="m-text-block"></div>
        </div>

        <div class="m-section">
          <div class="m-section-header">
            <h1 class="m-header-text">COMM_CHANNELS</h1>
          </div>
          <div id="m-contact-block" class="m-text-block" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>
      </div>

      <nav class="mobile-nav">
        <a href="#" class="m-nav-item active">
          <span class="m-nav-icon">■</span>
          <span>HOME</span>
        </a>
        <a href="#" class="m-nav-item">
          <span class="m-nav-icon">▲</span>
          <span>PROJ</span>
        </a>
        <a href="#" class="m-nav-item">
          <span class="m-nav-icon">●</span>
          <span>INFO</span>
        </a>
        <a href="#" class="m-nav-item">
          <span class="m-nav-icon">▼</span>
          <span>COMM</span>
        </a>
      </nav>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
